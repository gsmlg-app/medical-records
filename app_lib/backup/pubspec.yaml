name: app_backup
description: Backup and restore services for medical records application
publish_to: "none"

environment:
  sdk: ">=3.8.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Internal packages
  app_database: any
  app_logging: any
  app_storage: any

  # External dependencies
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.6
  archive: ^4.0.0
  drift: ^2.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  bloc_test: ^10.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.0
  path_provider_platform_interface: ^2.1.0
